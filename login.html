<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - Holy Childhood High School</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo-text" style="display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;">
    <img src="assets/HCHS_logo.jpg" alt="Holy Childhood High School Crest" style="height: 28px; width: 28px; flex-shrink: 0; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--hchs-gold);">
    <span>HCHS Portal</span>
</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="card">
            <h1>Portal Login</h1>
            <p>Enter your account details to continue.</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label>
                        <input type="checkbox" id="show-password">
                        Show Password
                    </label>
                </div>

                <button type="submit" class="btn-primary">
                    Login
                </button>

                <p id="login-message" role="alert"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Holy Childhood High School Portal | CIT2011 Web Programming</p>
    </footer>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
