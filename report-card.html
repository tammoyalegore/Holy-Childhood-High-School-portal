<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Cards | Holy Childhood High School</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <!-- Header (hidden when printing) -->
    <header class="no-print">
        <nav>
            <a href="index.html" class="logo-text" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
                <img src="assets/HCHS_logo.jpg" alt="Holy Childhood High School Crest" style="height: 42px; width: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--hchs-gold);">
                <span style="color: var(--hchs-gold); font-weight: bold; font-size: 1.1rem;">HCHS Portal</span>
            </a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="teacher.html">Teacher Panel</a></li>
                <li><a href="report-card.html">Report Cards</a></li>
                <li><button class="btn-primary" style="padding: 8px 16px;" onclick="logout()">Logout</button></li>
            </ul>
        </nav>
    </header>

    <main>

         <!-- Form to pick student and semester -->
        <section class="card no-print">
            <h1 style="color: var(--hchs-gold); margin-top: 0;">Report Card Generator</h1>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                <div class="form-group">
                    <label for="studentSelect">Student</label>
                    <select id="studentSelect"></select>
                </div>

                <div class="form-group">
                    <label for="semesterSelect">Semester</label>
                    <select id="semesterSelect"></select>
                </div>
            </div>

            <button id="generateBtn" class="btn-primary">Generate Report Card</button>
            <button id="printBtn" class="btn-primary" style="background-color: #64748b;" disabled>Print</button>

            <p id="reportFeedback" style="color: var(--hchs-gold); margin-top: 12px;"></p>
        </section>

        <!-- Where the generated report card appears -->
        <div id="reportCardOutput" class="report-layout"></div>

    </main>

    <footer class="no-print">
        <p>&copy; 2026 Holy Childhood High School Portal</p>
    </footer>

    <script src="js/database.js"></script>
    <script src="js/session.js"></script>
    <script>checkRole("teacher");</script>
    <script src="js/portal-data.js"></script>
    <script src="js/report-card.js"></script>
</body>
</html>
